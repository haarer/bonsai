version: '3.8'
services:
  api:
    build: ../backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:pass@db:5432/receipts
      # OpenAI-compatible upstream (llama.cpp / Ollama / hosted).
      # Note: .local (mDNS) may not resolve inside the container — use the LAN IP if so.
      - VISION_BASE_URL=http://schleppx.local:1235
      - VISION_MODEL=qwen2.5-vl-3b-instruct
    depends_on:
      - db
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: receipts
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
